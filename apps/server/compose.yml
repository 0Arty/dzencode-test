services:
   postgres:
      image: postgres:16
      container_name: nest-postgres
      restart: unless-stopped

      environment:
         POSTGRES_DB: cars
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: password

      ports:
         - '5433:5432'

      volumes:
         - postgres_data:/var/lib/postgresql/data

volumes:
   postgres_data:
