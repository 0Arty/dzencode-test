services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./apps/server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "${SERVER_PORT}:3000"
    depends_on:
      - postgres

  client:
    build:
      context: ./apps/client
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CLIENT_PORT}:5173"
    depends_on:
      - server

volumes:
  pgdata: